<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>5.5E cards</title>
        <link rel="stylesheet" href="style.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Almendra:ital,wght@0,400;0,700;1,400;1,700&family=Germania+One&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <script type="module" src="app.js"></script>
    </head>
    <body>
        <header>
            <button onclick="window.location.href = 'index.html';">All cards</button>
        </header>
        <main>
            <div class="card">
                <div class="card-head">Item</div>
                <div class="card-main">
                    <div class="card-img">
                        <img src="https://static.vecteezy.com/system/resources/thumbnails/010/331/415/small/watercolor-paint-stains-backgrounds-art-element-illustration-for-your-design-free-png.png" />
                        <img style="--scale: 1; --rotate: 0deg;" src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Flogos-world.net%2Fwp-content%2Fuploads%2F2021%2F12%2FDnD-Symbol.png&f=1&nofb=1&ipt=9e77008fc76ea4788d647b4b63ea67e8e3307b56410cb5764559a807e2768b57"/>
                    </div>
                    <div class="card-stat">
                        <div class="card-dmg">A</div>
                        <div class="card-mastery">B</div>
                        <div class="card-ac">C</div>
                        <div class="card-property">D</div>
                        <div class="card-property">D</div>
                    </div>
                    <div class="card-text">
                        Description...
                    </div>
                </div>
                <div class="card-footer">
                    <div>
                        <div class="card-type">Item</div>
                        <div class="card-rarity rare">rare</div>
                    </div>
                    <div>
                        <div class="card-value">999 GP</div>
                        <div class="card-weight">999 lb</div>
                    </div>
                </div>
            </div>
        </main>
        <footer>
            DnD 5.5E item's card generator 2026.
        </footer>
    </body>
</html>
